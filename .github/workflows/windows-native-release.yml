name: Native Windows MSVC release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-native-release.yml
      - tools/package_windows_native.py
      - CMakeLists.txt
      - Source/**
      - tests/**
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch the verified JUCE version used for the native build
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git "$env:RUNNER_TEMP/JUCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = git -C "$env:RUNNER_TEMP/JUCE" rev-parse HEAD
          if ($actual.Trim() -ne '29396c22c93392d6738e021b83196283d6e4d850') { throw 'Unexpected JUCE revision.' }
      - name: Configure Visual Studio 2022 x64
        run: cmake -S . -B build-msvc -G "Visual Studio 17 2022" -A x64 -T v143 -DJUCE_SOURCE_DIR="$env:RUNNER_TEMP/JUCE" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
      - name: Build native modules and hosts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & cmake --build build-msvc --config Release --parallel 2 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-windows-build.log"
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }
      - name: Test actual Windows DLL loading, audio and editor
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & ctest --test-dir build-msvc -C Release --output-on-failure --output-junit "$env:RUNNER_TEMP/windows-tests.xml" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/native-windows-tests.log"
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }
      - name: Package only after the native tests pass
        run: python tools/package_windows_native.py --artifacts build-msvc/VocalBalance_artefacts/Release --test-report "$env:RUNNER_TEMP/windows-tests.xml" --juce "$env:RUNNER_TEMP/JUCE" --source-sha "$env:GITHUB_SHA" --version 0.1.1
      - name: Publish verified downloads to this repository
        shell: pwsh
        run: |
          git fetch origin main
          $remote = git rev-parse origin/main
          if ($remote.Trim() -ne $env:GITHUB_SHA) { throw 'Main changed during the build. Rerun this workflow on the current main; no files were overwritten.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md downloads/README.md downloads/SHA256SUMS.txt downloads/WINDOWS_NATIVE_BUILD.json downloads/VocalBalance-0.1.1-VST2-Windows-x64-MSVC.zip downloads/VocalBalance-0.1.1-VST3-Windows-x64-MSVC.zip downloads/VocalBalance-0.1.1-Sources.zip
          git commit -m 'Publish natively tested Windows MSVC 0.1.1 packages [skip ci]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish failure details for diagnosis
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-reports -Force | Out-Null
          $report = @("Source: $env:GITHUB_SHA", "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID")
          foreach ($name in @('native-windows-build.log', 'native-windows-tests.log')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) { $report += Get-Content -LiteralPath $path -Tail 1600 }
          }
          $report | Set-Content -LiteralPath build-reports/windows-native-last.log -Encoding UTF8
          git fetch origin main
          $remote = git rev-parse origin/main
          if ($remote.Trim() -ne $env:GITHUB_SHA) { Write-Warning 'Main changed; diagnostic report was not pushed.'; exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build-reports/windows-native-last.log
          git commit -m 'Record native Windows build diagnosis [skip ci]'
          if ($LASTEXITCODE -eq 0) { git push origin HEAD:main }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-native-build-evidence
          path: |
            build-msvc/VocalBalance_artefacts/Release/VST2/
            build-msvc/VocalBalance_artefacts/Release/VST3/
            build-reports/
            ${{ runner.temp }}/windows-tests.xml
            ${{ runner.temp }}/native-windows-build.log
            ${{ runner.temp }}/native-windows-tests.log
